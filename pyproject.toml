[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "catscii"
version = "0.1.0"
description = "Turn any image into ASCII art, with a playful cat theme"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pillow"]

[project.optional-dependencies]
fast = ["numpy"]

[project.scripts]
catscii = "catscii:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["catscii*", "banner*", "styles*"]
